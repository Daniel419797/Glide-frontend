name: Frontend CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GLIDE_API_URL: http://127.0.0.1:5000/api/v1
      GLIDE_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: docker build -t glide-frontend:${{ github.sha }} .
